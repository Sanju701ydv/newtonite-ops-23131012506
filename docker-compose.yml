services:
  db:
    image: postgres:16-alpine
    environment: {POSTGRES_USER: ops, POSTGRES_PASSWORD: ops, POSTGRES_DB: ops}
    healthcheck: {test: ["CMD-SHELL","pg_isready -U ops"], interval: 3s, retries: 20}
    ports: ["5432:5432"]
  app:
    build: .
    depends_on: {db: {condition: service_healthy}}
    environment:
      DATABASE_URL: postgres://ops:ops@db:5432/ops
      TOKEN_SECRET: dev-secret-change-me
    ports: ["3000:3000"]
